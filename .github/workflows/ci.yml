name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-counter-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-counter-app:local

      - name: Smoke test
        run: |
          printf 'POSTGRES_USER=ci_user\nPOSTGRES_PASSWORD=ci_pass\nPOSTGRES_DB=ci_db\n' > .env
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fs localhost:8080 | grep -q "Hello DevOps"; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}